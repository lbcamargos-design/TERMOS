<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Termos de Consentimento</title>
<style>
/* Paleta: Neblina Perene (Evergreen Fog, SW 9130) */
:root{--fog:#8d9a80;--fog-d:#667357;--fog-dd:#4c5741;--fog-l:#eef0e8;--fog-xl:#fbfaf7;--card:#fff;--ink:#2b2f27;--muted:#7a776f;--line:#e5dfd4;--bege:#d4c3b1;--bege-l:#f6f0e8;--warn:#a2401f;--ok:#4c7341;--ok-l:#e8f0e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fog-xl);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:#fff;color:var(--ink);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:3px solid var(--bege)}
.top .tl{display:flex;align-items:center;gap:14px;min-width:0}.top .mono{height:40px;flex:none}
.marca{font-family:Georgia,"Times New Roman",serif;font-size:21px;letter-spacing:.04em;color:var(--fog-dd)}.sub{font-size:13.5px;color:var(--muted)}
.hero{background:#fff;border-bottom:3px solid var(--bege);text-align:center;padding:22px 16px 14px}.hero img{height:118px;max-width:80%}.hero .sub{margin-top:4px;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.ident{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;background:var(--bege-l);border:1px solid var(--bege);border-radius:12px;padding:14px 18px;margin:0 0 20px;font-family:system-ui,sans-serif}
.ident small{display:block;font-size:.62em;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.ident b{display:block;font-size:.98em;color:var(--fog-dd);letter-spacing:.02em}.ident i{font-style:normal;font-size:.78em;color:var(--muted)}
@media(max-width:620px){.ident{grid-template-columns:1fr}}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 120px}
h1{font-size:26px;line-height:1.25;margin:8px 0 18px;font-weight:650}h2{font-size:19px;margin:24px 0 12px}
h3.grupo{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fog-d);margin:26px 0 10px}
.muted{color:var(--muted)}.small{font-size:14px}
.lista{display:grid;gap:10px}
.card-term{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--fog);border-radius:12px;padding:16px 20px;cursor:pointer}
.card-term .ct{display:flex;flex-direction:column}.card-term span{font-weight:600;font-size:18px}.card-term small{color:var(--muted)}
.card-term .mk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid #b3b5aa;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-weight:700}
.card-term.sel{background:var(--fog-l);border-color:var(--fog-d)}.card-term.sel .mk{background:var(--fog-d);border-color:var(--fog-d)}.card-term.sel .mk::after{content:"✓"}
.card-term.geral{border-left-color:var(--fog-dd);background:#fbfbf8}.card-term.geral small.rec{display:inline-block;margin-top:2px;font-weight:600;color:var(--fog-dd)}
.toposel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 4px}
.barra{position:sticky;bottom:48px;display:flex;justify-content:flex-end;margin-top:22px}
.foot{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:8px;background:linear-gradient(transparent,var(--fog-xl) 40%)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px;cursor:pointer;font-size:14px}
.btn{border:0;border-radius:10px;padding:15px 26px;font-weight:650;cursor:pointer;background:var(--fog-d);color:#fff;min-height:54px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:active{background:var(--fog-dd)}
.btn:disabled{background:#b9bbb1;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--card);color:var(--fog-dd);border:1.5px solid var(--fog-d)}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px}
.acoes{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.texto{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;max-height:58vh;overflow:auto;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65}
.texto .tp{display:block;text-align:center;font-weight:700;letter-spacing:.03em}.texto .tt{display:block;text-align:center;margin-bottom:6px}
.aviso{background:#f7f3e6;border:1px solid #e3d7b3;border-radius:10px;padding:12px 14px;font-size:15px;margin:12px 0}
.aviso.ok{background:#edf3ea;border-color:#c3d6bc}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:18px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
label.f textarea{min-height:320px;font-size:16px;line-height:1.5;font-family:Georgia,serif}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--fog-d)}
.req{color:var(--warn)}
.err{color:var(--warn);font-size:15px;font-weight:500;min-height:1em}
.idade{font-size:15px;color:var(--fog-dd);font-weight:600;min-height:1.4em}
.rep{border:1.5px solid var(--fog);background:var(--fog-l);border-radius:12px;padding:16px;display:none}
.rep.on{display:grid}
.chk{display:flex;gap:14px;align-items:flex-start;background:var(--fog-l);border-radius:10px;padding:16px;cursor:pointer;font-size:17px}
.chk input{width:28px;height:28px;flex:none;margin:0;accent-color:var(--fog-d)}
.sigwrap{background:#fff;border:2px dashed #a9ab9f;border-radius:12px;position:relative;margin-top:10px}
#sig{width:100%;height:240px;display:block;touch-action:none;border-radius:12px}
.sigline{position:absolute;left:8%;right:8%;bottom:52px;border-top:1px solid #9a9c91;pointer-events:none}
.siglbl{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.foto{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}
.foto img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.resumo{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.resumo b{color:var(--muted);font-weight:600}
.okbig{text-align:center;padding:60px 20px}
.okbig .circ{width:96px;height:96px;border-radius:50%;background:var(--fog-d);box-shadow:0 0 0 8px var(--bege-l);color:#fff;font-size:56px;line-height:96px;margin:0 auto 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-size:15px}
.tabs button.on{background:var(--fog-d);color:#fff;border-color:var(--fog-d)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--fog-l);font-weight:650}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--fog-l);color:var(--fog-dd);text-decoration:none}
.pill.off{background:#eee;color:#888}
.pin{display:flex;gap:10px;justify-content:center;margin:20px 0}
.pin input{width:200px;text-align:center;font-size:30px;letter-spacing:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23271f;color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;z-index:9;max-width:90vw}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--fog-d)}
.ferr{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:8px}
.doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 34px;max-height:58vh;overflow:auto;font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,18px);line-height:1.7;color:#22261e;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.doc .tp{font-family:system-ui,sans-serif;font-weight:700;letter-spacing:.08em;font-size:.7em;color:var(--fog-d);text-align:center}
.doc .tt{font-size:1.3em;text-align:center;margin:4px 0 20px;font-weight:600}
.doc p{margin:0 0 12px}.doc strong{font-weight:700;letter-spacing:.02em;color:#1f241b}
.doc h3.sec{font-family:system-ui,sans-serif;font-size:.92em;font-weight:700;color:var(--fog-dd);margin:24px 0 10px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.doc h3.sec b{display:inline-flex;width:1.9em;height:1.9em;border-radius:50%;background:var(--fog-l);color:var(--fog-dd);align-items:center;justify-content:center;font-size:.82em;flex:none}
.doc h3.sec.r{color:#8a3a1c}.doc h3.sec.r b{background:#f6e7df;color:#8a3a1c}
.doc h3.sec.d{color:#3f6534}.doc h3.sec.d b{background:#e3eedf;color:#3f6534}
.doc ul.al{margin:0 0 12px;padding-left:1.3em}.doc ul.al li{margin:7px 0;padding-left:.2em}.doc ul.al li::marker{color:var(--fog-d)}
.doc .itc{display:grid;grid-template-columns:2.1em 1fr;gap:4px 12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.doc .itc>.n{width:2em;height:2em;border-radius:50%;background:var(--fog-l);color:var(--fog-dd);font:700 .8em system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.doc .itc p{margin:0 0 6px}.doc .itc ul{margin:4px 0 6px;padding-left:1.2em}.doc .itc li{margin:4px 0}
.doc .itok{display:inline-flex;gap:10px;align-items:center;margin-top:6px;padding:8px 14px;border:1.5px solid var(--fog);border-radius:999px;font:600 .82em system-ui,sans-serif;color:var(--fog-dd);cursor:pointer;background:#fff}
.doc .itok input{width:22px;height:22px;margin:0;accent-color:var(--fog-d)}
.doc .itok.on{background:var(--ok-l,#e3eedf);border-color:#9fbf93;color:#2f5326}
.picto{display:flex;gap:18px;align-items:center;background:#fdf1ec;border:2px solid #c0392b;border-radius:14px;padding:16px 18px;margin:8px 0 16px;font-family:system-ui,sans-serif}
.picto svg{width:96px;height:96px;flex:none}.picto b{display:block;color:#a12a1c;font-size:1.05em;line-height:1.3}.picto span{font-size:.85em;color:#5a2b22}
.barr{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.barr i{display:block;height:100%;width:0;background:var(--fog-d);transition:width .15s}
.passo{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);margin:-6px 0 14px}
@media(max-width:620px){.doc{padding:18px}}
@media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:22px}.texto{font-size:16px;padding:16px}.marca{font-size:18px}}
</style>
</head>

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

${o.obj}

[] Compreendi que a isotretinoína, indicada ao(à) paciente {{NOME}}, do sexo {{SEXO}}, com {{IDADE}}, é um medicamento usado para tratar:
- acne nodular grave;
- acne resistente a qualquer outro tipo de tratamento, incluindo antibióticos por via oral;
- acne moderada com tendência a cicatrizes;
- acne grave ou moderada com repercussões psicológicas e sociais.
> Se não tratadas, essas formas de acne podem deixar cicatrizes permanentes.
[] Fui informado(a) sobre todas as opções de tratamento da acne.
[] Compreendi as explicações sobre os efeitos colaterais que podem ocorrer durante o tratamento. Os mais frequentes são o ressecamento dos lábios, da pele, dos olhos e do nariz, e o uso de isotretinoína durante a gravidez pode provocar defeitos congênitos graves no bebê. Pacientes mulheres em idade fértil assinam, também, o Termo de Conhecimento de Riscos sobre defeitos ao nascimento.
[] Compreendi que alguns pacientes, durante o uso ou logo após interromper a isotretinoína, apresentaram depressão ou outros sintomas psiquiátricos, que não são bem definidos e podem incluir:
- tristeza ou crises de choro;
- ansiedade ou mau humor;
- perda de interesse em atividades sociais ou esportivas de que antes gostava;
- falta ou excesso de sono;
- mudança no grau de irritabilidade, raiva ou agressividade;
- alterações de apetite ou perda de peso;
- problemas de concentração ou de comportamento;
- queda do rendimento escolar ou no trabalho;
- desejo de se afastar dos amigos ou da família;
- falta de energia;
- sentimentos estranhos, ideias de autoagressão ou de tirar a própria vida.
[] Compreendi que, durante o tratamento com isotretinoína, alguns pacientes tiveram ideias de autoagressão ou suicidas, e que há relatos de que algumas dessas pessoas não aparentavam estar deprimidas. Embora existam relatos de suicídio, não há comprovação científica de que a isotretinoína tenha causado esses comportamentos ou de que eles não teriam ocorrido de qualquer modo.
[] Antes de iniciar o tratamento, informarei ao(à) médico(a), se for do meu conhecimento, se o(a) paciente ou algum familiar já teve sintomas de depressão ou outros problemas psiquiátricos, ou tomou medicamentos para esses problemas.
[] Durante o tratamento, suspenderei o medicamento e avisarei imediatamente o(a) médico(a) se surgir qualquer dos sintomas descritos no item 4.
[] Retornarei ao(à) médico(a) todos os meses durante o tratamento, para obter nova receita, acompanhar a evolução e verificar sinais de efeitos colaterais e os resultados dos exames de controle.
[] A isotretinoína será prescrita apenas para o(a) paciente e não será dividida com outras pessoas, pelo risco de efeitos colaterais graves, inclusive defeitos ao nascimento, se tomada por mulher grávida ou que engravide durante o uso.
[] O(a) paciente não doará sangue durante o tratamento e até um mês após o seu término, pois, se uma gestante receber esse sangue, o bebê pode ser exposto à isotretinoína e nascer com defeitos graves.
[] Li e compreendi os materiais informativos fornecidos pelo(a) médico(a), com orientações importantes sobre o uso seguro da isotretinoína.
[] O(a) médico(a) e eu decidimos pelo tratamento com isotretinoína. Compreendi que cada receita deve estar acompanhada deste termo, lido e assinado, e da cópia dos resultados dos exames realizados.

3. AUTORIZAÇÃO
Autorizo o(a) {{MEDICO}} a iniciar o tratamento do(a) paciente com isotretinoína.

4. DECLARAÇÃO DO(A) MÉDICO(A)
O(a) médico(a) que assina este termo declara que:
a) explicou ostensivamente ao(à) paciente a natureza e a finalidade do tratamento com isotretinoína, incluindo benefícios, efeitos colaterais e riscos;
b) forneceu material informativo e respondeu, da melhor forma possível, às questões apresentadas sobre o tratamento;
c) solicitou e conferiu os resultados dos exames preventivos, conforme o protocolo.

5. MEUS DIREITOS E PRIVACIDADE
Posso desistir do tratamento a qualquer momento, sem prejuízo do atendimento. ${VIA} ${PRIVACIDADE}`},

{id:'derm-isotretinoina-mulher',vinculado:'derm-isotretinoina',condicao:'mulher-fertil',grupo:GRUPOS[4],tipo:'Termo de Conhecimento de Riscos e Consentimento — Isotretinoína',titulo:'Isotretinoína — mulheres em idade fértil (riscos ao bebê)',texto:
`{{DECLARANTE}}, declaro que recebi do(a) {{MEDICO}}, da {{CLINICA}}, as informações abaixo sobre o risco de defeitos ao nascimento associado à isotretinoína, nos termos do modelo de Termo de Conhecimento de Riscos e Consentimento da Portaria CVS n.º 23/2003 (Anexo I), destinado a pacientes mulheres em idade fértil.

[!GRAVIDEZ]

1. ANTES DE CONFIRMAR
Leia cada item e confirme, um a um, que compreendeu e concorda em seguir as orientações médicas. Se a paciente for menor de 18 anos, os pais ou o responsável também devem ler e confirmar cada item. Não confirme este termo e não tome isotretinoína se houver qualquer coisa que não tenha entendido.

2. ITENS QUE DEVO LER E CONFIRMAR
[] Compreendi que a paciente não deve estar grávida nem engravidar durante o tratamento com isotretinoína e por um mês após o seu término. Há alto risco de o bebê nascer com defeitos congênitos graves se ocorrer gravidez durante o uso de isotretinoína, em qualquer dose, mesmo por pouco tempo.
[] Compreendi que a paciente não deve tomar isotretinoína se estiver grávida.
[] Compreendi que a paciente não deve ter relações sexuais ou deve usar dois métodos anticoncepcionais eficazes ao mesmo tempo, sendo um primário e outro secundário. A única exceção é a paciente que tenha feito cirurgia de retirada do útero (histerectomia).
[] Compreendi que a pílula anticoncepcional e os anticoncepcionais hormonais injetáveis, implantáveis ou de inserção estão entre os métodos mais eficazes, mas que um único método pode falhar. Por isso, é preciso usar dois métodos diferentes ao mesmo tempo, em todas as relações sexuais, mesmo que um deles seja a pílula ou a injeção anticoncepcional.
[] Informarei ao(à) médico(a) qualquer medicamento ou erva que a paciente pretenda usar durante o tratamento, pois os anticoncepcionais hormonais podem não funcionar com certos medicamentos ou ervas (por exemplo, erva-de-são-joão, Hypericum perforatum).
[] Compreendi que são métodos anticoncepcionais eficazes:
- primários: ligadura tubária, vasectomia do parceiro, pílula anticoncepcional, anticoncepcionais hormonais injetáveis, implantáveis ou de inserção e DIU (dispositivo intrauterino);
- secundários: diafragma e camisinha masculina ou feminina, cada um usado com creme ou gel espermicida.
> Pelo menos um dos dois métodos utilizados deve ser primário.
[] Compreendi que os métodos anticoncepcionais escolhidos devem estar em uso há, no mínimo, um mês antes do início da isotretinoína.
[] Compreendi que a isotretinoína só pode ser prescrita após dois testes de gravidez com resultado negativo: o primeiro, quando o(a) médico(a) decidir prescrever o medicamento; o segundo, nos cinco primeiros dias do período menstrual, pouco antes do início do tratamento, ou conforme orientação médica. O teste de gravidez será repetido todos os meses durante o tratamento.
[] Li e compreendi o material informativo fornecido pelo(a) médico(a), inclusive as orientações sobre anticoncepção eficaz.
[] Compreendi que a paciente deve parar de tomar isotretinoína e avisar o(a) médico(a) se engravidar, se a menstruação não vier, se parar de usar os métodos anticoncepcionais ou se tiver relação sexual sem usar os dois métodos escolhidos.
[] Compreendi que a paciente está apta a receber a prescrição de isotretinoína porque:
- teve dois testes de gravidez negativos antes da prescrição inicial e fará novo teste, com resultado negativo, todos os meses, antes de cada nova receita;
- escolheu e concordou em usar dois métodos anticoncepcionais eficazes ao mesmo tempo, sendo pelo menos um primário, salvo abstinência sexual absoluta ou histerectomia, por no mínimo um mês antes, durante e por um mês após o tratamento, e receberá orientação mensal sobre anticoncepção e comportamentos que aumentam o risco de gravidez;
- assinou o Termo de Consentimento Informado e este Termo de Conhecimento de Riscos, que alertam para os riscos de defeitos ao nascimento se o bebê for exposto à isotretinoína;
- teve todas as dúvidas respondidas pelo(a) médico(a) e compreendeu que é de sua responsabilidade não engravidar durante o uso e por um mês após o término do tratamento.

3. AUTORIZAÇÃO
Autorizo o(a) {{MEDICO}} a iniciar o tratamento da paciente com isotretinoína.

4. DECLARAÇÃO DO(A) MÉDICO(A)
O(a) médico(a) que assina este termo declara que:
a) explicou ostensivamente à paciente a natureza e a finalidade do tratamento com isotretinoína, incluindo benefícios, efeitos colaterais e riscos;
b) forneceu material informativo e respondeu, da melhor forma possível, às questões apresentadas sobre o tratamento;
c) solicitou e conferiu os resultados dos exames preventivos, conforme o protocolo.

5. MEUS DIREITOS E PRIVACIDADE
Posso desistir do tratamento a qualquer momento, sem prejuízo do atendimento. ${VIA} ${PRIVACIDADE}`}

`{{DECLARANTE}}, declaro que recebi do(a) {{MEDICO}}, da {{CLINICA}}, explicações claras e em linguagem acessível sobre os procedimentos dermatológicos descritos neste termo, e que tive oportunidade de fazer perguntas, todas respondidas de forma satisfatória.

1. O QUE ESTE TERMO ABRANGE
Este termo reúne, em um único documento, o atendimento dermatológico, os exames, os registros fotográficos do prontuário, o tratamento de dados pessoais e os procedimentos dermatológicos mais realizados na clínica, dispensando a assinatura de termos separados para cada um deles. Ele vale para os procedimentos indicados ao(à) paciente durante o acompanhamento, sempre após explicação prévia do(a) médico(a), podendo eu recusar qualquer deles a qualquer momento. Para cada procedimento, informa-se o que é, para que serve, quanto tempo dura, o benefício esperado, os riscos específicos e os cuidados antes e depois.

2. EXAME DERMATOLÓGICO E FOTOS DO PRONTUÁRIO
a) ${B('O que é:')} entrevista sobre o histórico de saúde e exame da pele, do couro cabeludo, das unhas e das mucosas, com dermatoscopia e, quando clinicamente indicado, exame das regiões íntimas, sendo-me assegurado o direito de pedir a presença de acompanhante.
b) ${B('Para que serve:')} identificar lesões e doenças da pele e indicar o tratamento adequado.
c) ${B('Exames complementares:')} autorizo a realização de exames complementares não invasivos, como dermatoscopia digital e exame com luz de Wood, e de pequenos procedimentos diagnósticos previamente explicados, como a coleta de material por raspagem da pele, das unhas ou do couro cabeludo para exame em laboratório.
d) ${B('Fotos do prontuário:')} autorizo o registro fotográfico das lesões e regiões examinadas, inclusive por dermatoscopia digital, apenas para diagnóstico e acompanhamento da evolução; as fotos integram o prontuário, sob sigilo, e não são divulgadas sem autorização específica.
e) ${B('Direito de recusa:')} posso recusar qualquer exame ou registro fotográfico e revogar esta autorização a qualquer momento, sem prejuízo do atendimento, permanecendo no prontuário, por exigência legal, os registros já realizados.

${secoes}

${k+1}. BENEFÍCIOS E LIMITES DO RESULTADO
Espera-se o diagnóstico, o tratamento ou a melhora da condição tratada. A Medicina não é uma ciência exata: o resultado depende das características de cada organismo, e a atuação médica é obrigação de meio, e não de resultado, inexistindo garantia do resultado pretendido. Procedimentos estéticos têm efeito temporário e podem exigir manutenção.

${k+2}. RISCOS COMUNS A TODOS OS PROCEDIMENTOS
Além dos riscos específicos descritos acima, qualquer procedimento pode causar, entre outros:
a) dor, ardor, vermelhidão, inchaço, manchas roxas e sangramento;
b) infecção e alergia, inclusive ao anestésico ou aos produtos utilizados;
c) manchas claras ou escuras e cicatriz, inclusive elevada ou queloide;
d) resultado diferente do esperado, reaparecimento da lesão ou necessidade de nova sessão ou de novo procedimento.

${k+3}. OUTRAS OPÇÕES DE TRATAMENTO
Fui informado(a) de que existem alternativas, como medicamentos, cremes, outros procedimentos ou o simples acompanhamento, bem como a opção de não realizar o procedimento, com as vantagens e limitações de cada uma.

${k+4}. ANTES DE QUALQUER PROCEDIMENTO
Devo informar o uso de medicamentos, especialmente anticoagulantes e isotretinoína, alergias, gestação ou amamentação, herpes, tendência a queloide, marca-passo ou implantes e exposição recente ao sol, além de seguir as orientações específicas recebidas e comparecer com a pele limpa e sem maquiagem na área.

${k+5}. DEPOIS DE QUALQUER PROCEDIMENTO
Comprometo-me a seguir as orientações sobre curativo, higiene, protetor solar, medicamentos e retornos, e a procurar a clínica imediatamente em caso de dor intensa, febre, secreção, pele pálida ou escurecida ou alteração da visão, ciente de que o descumprimento dessas recomendações pode prejudicar o resultado e a saúde do(a) paciente.

${k+6}. INFORMAÇÕES DE SAÚDE
Declaro ter informado com verdade e de forma completa o histórico de saúde do(a) paciente, inclusive doenças, alergias, medicamentos em uso e procedimentos anteriores, ciente de que a omissão ou a inexatidão dessas informações pode comprometer a segurança e o resultado.

${k+7}. MEUS DIREITOS
a) posso recusar qualquer procedimento e desistir deste consentimento a qualquer momento, antes ou durante o procedimento, sem nenhuma penalidade e sem prejuízo do atendimento;
b) posso pedir novas explicações sempre que tiver dúvidas;
c) ${VIA.charAt(0).toLowerCase()+VIA.slice(1)}

${k+8}. PRIVACIDADE E PROTEÇÃO DE DADOS
a) ${B('Uso dos dados:')} os dados pessoais e de saúde do(a) paciente, inclusive as fotos clínicas, são usados apenas para identificação, agendamento, atendimento, elaboração e guarda do prontuário, emissão de documentos, faturamento e cumprimento de obrigações legais, nos termos da Lei Geral de Proteção de Dados (Lei n.º 13.709/2018).
b) ${B('Compartilhamento:')} os dados só são compartilhados com laboratórios, operadoras de planos de saúde e demais prestadores estritamente necessários ao atendimento, ou com autoridades, quando houver determinação legal.
c) ${B('Guarda e segurança:')} os dados ficam guardados com sigilo profissional e medidas de segurança, com acesso restrito à equipe autorizada, pelo prazo legal de guarda do prontuário.
d) ${B('Direitos do titular:')} posso, a qualquer tempo, pedir confirmação do tratamento, acesso, correção, portabilidade ou eliminação dos dados e revogar este consentimento, ressalvadas as hipóteses de conservação previstas em lei.

${k+9}. CONSENTIMENTO
Declaro que li e compreendi este termo, que minhas dúvidas foram esclarecidas e que, de forma livre e voluntária, autorizo os procedimentos que me forem indicados entre os descritos acima, bem como a adoção das medidas necessárias diante de intercorrências imprevistas.`});

<script>
"use strict";
const {jsPDF}=window.jspdf;
const $=s=>document.querySelector(s);

const p2=n=>String(n).padStart(2,'0');
const uid=()=>{const d=new Date();return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`};

const extenso=d=>`${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;

/* ---------- SHA-256 (WebCrypto, com alternativa em JS puro) ---------- */
function sha256js(bytes){
  const H=[],K=[];let n=2,c=0;

  while(c<64){if(prime(n)){if(c<8)H[c]=frac(Math.pow(n,1/2));K[c]=frac(Math.pow(n,1/3));c++}n++}
  const l=bytes.length,len=(((l+9)+63)>>6)<<6,m=new Uint8Array(len);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(len-4,(l*8)>>>0);dv.setUint32(len-8,Math.floor(l*8/4294967296));

    for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4);
    for(let j=16;j<64;j++){const a=w[j-15],b=w[j-2];w[j]=(w[j-16]+(r(a,7)^r(a,18)^(a>>>3))+w[j-7]+(r(b,17)^r(b,19)^(b>>>10)))|0}
    let[a,b,cc,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&cc)^(b&cc)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha256(data){
  const bytes=typeof data==='string'?new TextEncoder().encode(data):new Uint8Array(data);
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',bytes);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  return sha256js(bytes);
}

let db;
function abrirDB(){return new Promise((res,rej)=>{const r=indexedDB.open('termos-consentimento',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('termos',{keyPath:'id'});d.createObjectStore('registros',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode),q=fn(t.objectStore(store));let out;if(q)q.onsuccess=()=>out=q.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbPut=(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());

const ANTIGOS=['Termo de Consentimento Livre e Esclarecido para Procedimento','Termo de Consentimento para Tratamento de Dados Pessoais (LGPD)'];
async function sincronizarModelos(agora){
  for(const m of MODELOS){const e=await dbGet('termos',m.id),ativo=m.ativo!==false;
    if(!e){await dbPut('termos',{...m,versao:1,ativo,atualizado:agora});continue}
    const n={...e,grupo:m.grupo,vinculado:m.vinculado,condicao:m.condicao};
    if(!e.editado&&(e.texto!==m.texto||e.titulo!==m.titulo||e.tipo!==m.tipo))Object.assign(n,{texto:m.texto,titulo:m.titulo,tipo:m.tipo,versao:e.versao+1,atualizado:agora});
    if(!n.vinculado)delete n.vinculado;if(!n.condicao)delete n.condicao;await dbPut('termos',n)}
}
async function semear(){
  const ver=await dbGet('kv','modelosVersao')||0,ex=await dbAll('termos'),agora=new Date().toISOString();
  if(ver<2){
    for(const t of ex)if(ANTIGOS.includes(t.titulo)&&t.ativo){t.ativo=false;await dbPut('termos',t)}
    for(const m of MODELOS)if(!ex.some(e=>e.id===m.id))await dbPut('termos',{...m,versao:1,ativo:m.ativo!==false,atualizado:agora});
    await dbPut('kv',2,'modelosVersao');
  }
  if(ver<3){
    if(ver>=2)for(const m of MODELOS){const e=await dbGet('termos',m.id);if(e&&e.versao===1)await dbPut('termos',{...e,...m,versao:2,atualizado:agora});else if(!e)await dbPut('termos',{...m,versao:1,ativo:m.ativo!==false,atualizado:agora})}
    await dbPut('kv',3,'modelosVersao');
  }
  if(ver<4){
    if(ver>=2)for(const m of MODELOS){const e=await dbGet('termos',m.id),ativo=m.ativo!==false;
      if(!e)await dbPut('termos',{...m,versao:1,ativo,atualizado:agora});
      else{const n={...e,grupo:m.grupo,ativo};if(!e.editado&&(e.texto!==m.texto||e.titulo!==m.titulo||e.tipo!==m.tipo)){Object.assign(n,{texto:m.texto,titulo:m.titulo,tipo:m.tipo,versao:e.versao+1,atualizado:agora})}delete n.editado;if(e.editado)n.editado=true;await dbPut('termos',n)}}
    await dbPut('kv',4,'modelosVersao');
  }
  if(ver<7){if(ver>=2)await sincronizarModelos(agora);await dbPut('kv',7,'modelosVersao')}
  const c=await dbGet('kv','config');
  if(!c)await setCfg({...CFG_PADRAO,pinHash:await sha256('pin:1234')});
  else if(c.clinica==='Nome da Clínica'){c.clinica=CFG_PADRAO.clinica;await setCfg(c)}
  {const ps=await getProfs(),pad=[{id:'P-GPCC',nome:'Dra. Giovanna Prata Ciabotti Camargos',registro:'CRM 58037 / RQE 27857',ativo:true},{id:'P-ID',nome:'Dra. Isabela Delfino',registro:'CRM 97877',ativo:true}];
   let mud=false;for(const x of pad)if(!ps.some(p=>p.id===x.id||p.registro===x.registro)){ps.push(x);mud=true}if(mud)await setProfs(ps)}
  if(c&&c.medico&&!(await dbGet('kv','profissionais')))await setProfs([{id:'P1',nome:c.medico,registro:c.crm?'CRM '+c.crm:'',ativo:true}]);
}

/* ---------- Identificação ---------- */
function cpfValido(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let d=(s*10)%11%10;if(d!==+c[9])return false;s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);d=(s*10)%11%10;return d===+c[10]}
const fmtCPF=v=>{v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};
const fmtData=v=>{v=v.replace(/\D/g,'').slice(0,8);return v.replace(/(\d{2})(\d)/,'$1/$2').replace(/(\d{2}\/\d{2})(\d)/,'$1/$2')};
function isoDe(br){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(br||'');if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getFullYear()!==+m[3]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[1])return null;if(d>new Date()||+m[3]<1900)return null;return `${m[3]}-${m[2]}-${m[1]}`}
function idade(iso){if(!iso)return null;const n=new Date(iso+'T12:00:00'),h=new Date();let a=h.getFullYear()-n.getFullYear();if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate()))a--;return a}

const PICTO=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#fff" stroke="#c0392b" stroke-width="8"/><circle cx="46" cy="24" r="8" fill="#23271f"/><path d="M40 34h12c4 0 6 3 6 6v6c9 2 13 9 13 16s-6 12-13 12h-2v14h-8V74h-6v14h-8V40c0-3 2-6 6-6z" fill="#23271f"/><line x1="18" y1="18" x2="82" y2="82" stroke="#c0392b" stroke-width="8"/></svg>`;

function renderDoc(t,texto){

    if(p==='[!GRAVIDEZ]'){fecha();fechaItem();h+=`<div class="picto">${PICTO}<div><b>NÃO TOME ISOTRETINOÍNA SE ESTIVER GRÁVIDA OU COM SUSPEITA DE GRAVIDEZ.</b><span>O medicamento causa defeitos graves no bebê. Evite a gravidez durante o tratamento e por um mês após o seu término.</span></div></div>`;continue}
    const it=/^\[\]\s+(.*)$/.exec(p);
    if(it){fecha();fechaItem();item++;emItem=true;h+=`<div class="itc"><div class="n">${item}</div><div><p>${destaca(it[1])}</p>`;continue}
    if(emItem&&/^- /.test(p)){if(!sub){h+='<ul>';sub=true}h+=`<li>${destaca(p.slice(2))}</li>`;continue}
    if(emItem&&/^> /.test(p)){if(sub){h+='</ul>';sub=false}h+=`<p>${destaca(p.slice(2))}</p>`;continue}
    fechaItem();
    if(!p){fecha();continue}

    if(m){fecha();const cls=/RISCO/.test(m[2])?' r':/DIREITO|PRIVACIDADE/.test(m[2])?' d':'';h+=`<h3 class="sec${cls}"><b>${m[1]}</b>${esc(cap(m[2]))}</h3>`;continue}
    const a=/^[a-z]\)\s+(.*)$/.exec(p);
    if(a){if(!lista){h+='<ul class="al">';lista=true}h+=`<li>${destaca(a[1])}</li>`;continue}
    fecha();h+=`<p>${destaca(p)}</p>`}
  fecha();fechaItem();return `<div class="tp">${esc((t.tipo||'Termo de Consentimento').toUpperCase())}</div><div class="tt">${esc(t.titulo)}</div>${h}`;

/* ---------- Evidências: IP e geolocalização ---------- */
async function obterIP(cfg){
  if(!cfg.regIP)return{status:'desativado'};
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);
  try{const r=await fetch('https://api.ipify.org?format=json',{signal:ctl.signal,cache:'no-store'});const j=await r.json();return j.ip?{ip:j.ip}:{status:'não obtido'}}
  catch(e){return{status:navigator.onLine===false?'dispositivo sem conexão com a internet':'não obtido'}}finally{clearTimeout(t)}
}
function obterGeo(cfg){
  return new Promise(res=>{
    if(!cfg.regGeo)return res({status:'desativado'});
    if(!navigator.geolocation)return res({status:'recurso indisponível no navegador'});
    const fim=setTimeout(()=>res({status:'tempo esgotado'}),15000);
    navigator.geolocation.getCurrentPosition(p=>{clearTimeout(fim);res({lat:p.coords.latitude,lon:p.coords.longitude,prec:Math.round(p.coords.accuracy),em:new Date(p.timestamp).toISOString()})},
      e=>{clearTimeout(fim);res({status:{1:'permissão negada no dispositivo',2:'posição indisponível',3:'tempo esgotado'}[e.code]||'não obtida'})},
      {enableHighAccuracy:true,timeout:14000,maximumAge:120000});
  });
}

function padAssinatura(cv){
  const ctx=cv.getContext('2d');let pts=0,des=false,ult=null,ini=null;
  const r0=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r0.width*dpr;cv.height=r0.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0a1f44';

  cv.onpointerdown=e=>{des=true;cv.setPointerCapture(e.pointerId);ult=pos(e);if(!ini)ini=new Date().toISOString()};
  cv.onpointermove=e=>{if(!des)return;const p=pos(e);ctx.lineWidth=1.6+2.2*(e.pointerType==='pen'?p.p:.55);ctx.beginPath();ctx.moveTo(ult.x,ult.y);ctx.lineTo(p.x,p.y);ctx.stroke();ult=p;pts++};
  cv.onpointerup=cv.onpointercancel=()=>{des=false};
  return{limpar:()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();pts=0;ini=null},vazio:()=>pts<15,inicio:()=>ini||new Date().toISOString(),png:()=>{
    const w=cv.width,h=cv.height,img=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
    for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(img[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    const m=12;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w,x1+m);y1=Math.min(h,y1+m);
    const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')}};
}
function reduzirImagem(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

  kv('Dispositivo',r.dispositivo);kv('Plataforma e idioma',`${r.plataforma||'—'} · ${r.idioma||'—'} · tela ${r.tela}`);

  secao('Integridade (SHA-256)');
  kv('Conteúdo do documento',r.hashConteudo,true);kv('Imagem da assinatura',r.hashAssinatura,true);if(r.hashFoto)kv('Foto de confirmação',r.hashFoto,true);if(r.hashAssProf)kv('Assinatura da médica',r.hashAssProf,true);

  y+=4;
  const nota=`O código de integridade do conteúdo foi calculado, no momento da assinatura, sobre o texto integral do termo, os dados do signatário, as informações de contexto acima e os códigos das imagens da assinatura${r.foto?' e da foto':''}, e permanece registrado na base da clínica, juntamente com o código do arquivo PDF, o que permite verificar qualquer alteração posterior. O QR code reproduz o identificador do registro e o código de integridade. Assinatura eletrônica nos termos do art. 10, § 2º, da Medida Provisória n.º 2.200-2/2001 e do art. 4º, inciso I, da Lei n.º 14.063/2020.`;
  doc.setFont('helvetica','normal');doc.setFontSize(7.8);const nl=doc.splitTextToSize(nota,CW-8);quebra(nl.length*3.5+8);
  doc.setFillColor(...COR.claro);doc.roundedRect(M,y-1,CW,nl.length*3.5+5,1.5,1.5,'F');doc.setTextColor(...COR.cinza);doc.text(nl,M+4,y+3.2);
  // rodapé
  const n=doc.getNumberOfPages();
  for(let i=p0;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7.3);doc.setTextColor(130);doc.setDrawColor(205);doc.setLineWidth(.2);doc.line(M,H-14,W-M,H-14);
    doc.text(`${r.clinica.nome}  ·  Registro ${r.id}  ·  SHA-256 ${r.hashConteudo.slice(0,20)}…`,M,H-10);doc.text(`Página ${i-p0+1} de ${n-p0+1}`,W-M,H-10,{align:'right'})}
  doc.setPage(n);return base?null:doc.output('arraybuffer');
}

const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function postDrive(cfg,payload){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(cfg.driveUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.driveToken,...payload}),signal:ctl.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.erro||'resposta inválida');return j}
  catch(e){throw new Error(e.name==='AbortError'?'tempo esgotado':(e.message||String(e)))}finally{clearTimeout(t)}
}
let enviando=false;
async function enviarPendentes(){
  const cfg=await getCfg();if(!cfg.driveUrl||enviando)return{n:0,falhas:0};
  enviando=true;let n=0,falhas=0;
  try{const regs=(await dbAll('registros')).filter(r=>r.drive==='pendente'||r.drive==='erro');
    for(const r of regs){
      const d=r.dados,menor=d.menor||d.resp;
      try{const j=await postDrive(cfg,{id:r.id,criado:r.criado,local:r.local,arquivo:r.arquivo,termo:r.termoTitulo,versao:r.termoVersao,paciente:d.nome,cpf:d.cpf||'',responsavel:menor?`${d.rnome} (${d.rvinc}) CPF ${d.rcpf}`:'',procedimento:Object.entries(r.valores||{}).map(([k,v])=>`${k}: ${v}`).join('; '),profissional:(r.profissional&&r.profissional.nome)||(r.clinica&&r.clinica.medico)||'',hashConteudo:r.hashConteudo,hashPDF:r.hashPDF,pdf:b64(r.pdf)});
        r.drive='enviado';r.driveUrl=j.url;r.driveEm=new Date().toISOString();delete r.driveErro;n++}
      catch(e){r.drive='erro';r.driveErro=e.message;falhas++}
      await dbPut('registros',r);
    }
    const pe=(await dbAll('registros')).filter(r=>r.dados.email&&(r.emailStatus==='pendente'||(r.emailStatus==='erro'&&(r.emailTent||0)<6)));
    const grupos={};pe.forEach(r=>{const k=r.emailGrupo||r.lote||r.id;(grupos[k]=grupos[k]||[]).push(r)});
    for(const g of Object.values(grupos)){
      const d=g[0].dados;
      try{await postDrive(cfg,{acao:'email',email:d.email,nome:d.nome,representante:(d.menor||d.resp)?d.rnome:'',clinica:cfg.clinica,responder:cfg.email||'',telefone:cfg.telefone||'',data:g[0].local,
          termos:g.map(r=>({titulo:r.termoTitulo,registro:r.id,arquivo:r.arquivo,pdf:b64(r.pdf)}))});
        for(const r of g){r.emailStatus='enviado';r.emailEm=new Date().toISOString();delete r.emailErro;await dbPut('registros',r)}}
      catch(e){for(const r of g){r.emailStatus='erro';r.emailErro=e.message;r.emailTent=(r.emailTent||0)+1;await dbPut('registros',r)}}
    }
  }finally{enviando=false}
  return{n,falhas};
}

  const ps=await getProfs();
  $('#painel').innerHTML=`<div style="margin-bottom:12px"><button class="btn sm" id="novo">+ Novo profissional</button></div>
  ${ps.length?`<div style="overflow:auto"><table><tr><th>Profissional</th><th>Registro</th><th>Assinatura cadastrada</th><th>Situação</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.registro)}</td><td>${p.assinatura?`<img src="${p.assinatura}" style="height:34px"><br><span class="pill ${p.autorizadoEm?'':'off'}">${p.autorizadoEm?'Uso automático autorizado':'Sem autorização de uso'}</span>`:'<span class="muted">—</span>'}</td><td><span class="pill ${p.ativo!==false?'':'off'}">${p.ativo!==false?'Ativo':'Inativo'}</span></td><td style="white-space:nowrap"><button class="btn sec sm" data-ed="${esc(p.id)}">Editar</button> <button class="btn sec sm" data-tg="${esc(p.id)}">${p.ativo!==false?'Desativar':'Ativar'}</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Nenhum profissional cadastrado. Cadastre ao menos um para que os termos tragam o nome, o registro e a assinatura do profissional responsável.</p>'}
  <p class="small muted">Com mais de um profissional ativo, a recepção escolhe o responsável ao selecionar os termos.</p>`;
  $('#novo').onclick=()=>editarProf(null);
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editarProf(ps.find(p=>p.id===b.dataset.ed)));
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const p=ps.find(x=>x.id===b.dataset.tg);p.ativo=p.ativo===false;await setProfs(ps);admProfs()});
}
function editarProf(p){
  $('#painel').innerHTML=`<div class="box"><div class="grid">
  <label class="f full"><span>Nome como deve constar no termo <span class="req">*</span></span><input id="pn" value="${esc(p&&p.nome)}" placeholder="Ex.: Dra. Nome Sobrenome"></label>
  <label class="f"><span>Registro profissional <span class="req">*</span></span><input id="pr" value="${esc(p&&p.registro)}" placeholder="Ex.: CRM-MG 00000"></label>
  <label class="f"><span>PIN pessoal ${p&&p.pinHash?'(em branco mantém o atual)':'(opcional)'}</span><input id="pp" type="password" inputmode="numeric" maxlength="12"></label>
  <div class="full"><b>Assinatura cadastrada</b> <span class="muted small">(o próprio profissional deve desenhá-la)</span>${p&&p.assinatura?`<div style="margin:8px 0"><img src="${p.assinatura}" style="height:60px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff"></div>`:''}
  <div class="sigwrap"><canvas id="sig"></canvas><div class="sigline"></div><div class="siglbl">Desenhe aqui para cadastrar ou substituir</div></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button class="btn sec sm" id="limpar">Limpar quadro</button>${p&&p.assinatura?'<button class="btn sec sm" id="remover">Remover assinatura cadastrada</button>':''}</div>
  <label class="chk" style="margin-top:14px"><input type="checkbox" id="paut" ${p&&p.autorizadoEm?'checked':''}><span>Autorizo a aposição automática da minha assinatura cadastrada nos termos de consentimento em que eu for indicado(a) como profissional responsável, ciente de que ela será aplicada no ato da assinatura do(a) paciente e de que posso revogar esta autorização a qualquer tempo.${p&&p.autorizadoEm?` <span class="muted small">Autorizado em ${dtBR(new Date(p.autorizadoEm))}.</span>`:''}</span></label></div></div>
  <p class="err" id="err"></p><div class="acoes"><button class="btn sec" id="canc">Cancelar</button><button class="btn" id="salv">Salvar</button></div></div>`;
  const pad=padAssinatura($('#sig'));$('#limpar').onclick=pad.limpar;let remover=false;
  if($('#remover'))$('#remover').onclick=()=>{remover=true;toast('A assinatura será removida ao salvar.')};
  $('#canc').onclick=()=>admin('profissionais');
  $('#salv').onclick=async()=>{const nome=$('#pn').value.trim(),reg=$('#pr').value.trim(),pin=$('#pp').value.trim(),e=[];
    if(nome.length<3)e.push('Informe o nome.');if(!reg)e.push('Informe o registro profissional.');
    if(pin&&!/^\d{4,12}$/.test(pin))e.push('O PIN deve ter de 4 a 12 dígitos.');const aut=$('#paut').checked;if(aut&&pad.vazio()&&!(p&&p.assinatura&&!remover))e.push('Para autorizar o uso automático, cadastre a assinatura no quadro.');
    if(e.length){$('#err').innerHTML=e.join('<br>');return}
    const ps=await getProfs(),novo={...(p||{id:'P'+Date.now(),ativo:true}),nome,registro:reg};
    if(pin)novo.pinHash=await sha256('pin:'+pin);if(!pad.vazio()){novo.assinatura=pad.png();if(aut)novo.autorizadoEm=new Date().toISOString()}else if(remover){delete novo.assinatura;delete novo.autorizadoEm}
    if(aut&&!novo.autorizadoEm)novo.autorizadoEm=new Date().toISOString();if(!aut)delete novo.autorizadoEm;
    const i=ps.findIndex(x=>x.id===novo.id);if(i>=0)ps[i]=novo;else ps.push(novo);await setProfs(ps);toast('Profissional salvo.');admin('profissionais')};
}
function admBackup(){
  $('#painel').innerHTML=`<div class="box"><h2 style="margin-top:0">Backup</h2>
  <p class="muted small">Os registros ficam guardados neste tablet. Exporte o backup com frequência e guarde-o em local seguro da clínica. O arquivo contém dados de saúde: trate-o como prontuário.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" id="exp">Exportar backup completo</button><label class="btn sec sm" style="display:inline-flex;align-items:center">Importar backup<input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div></div>
  <div class="box" style="margin-top:16px"><h2 style="margin-top:0">Verificar autenticidade de um PDF</h2>
  <p class="muted small">Selecione um PDF de termo para conferir se ele corresponde, sem nenhuma alteração, a um documento gerado por este sistema.</p>
  <label class="btn sec sm" style="display:inline-flex;align-items:center">Selecionar PDF<input type="file" id="ver" accept="application/pdf" style="display:none"></label><div id="res" style="margin-top:12px"></div></div>`;
  $('#exp').onclick=async()=>{const regs=await dbAll('registros');
    const dados={formato:'termos-consentimento',versao:3,exportado:new Date().toISOString(),config:await dbGet('kv','config'),profissionais:await getProfs(),termos:await dbAll('termos'),registros:regs.map(r=>({...r,pdf:b64(r.pdf)}))};
    baixar(new Blob([JSON.stringify(dados)],{type:'application/json'}),`backup_termos_${uid().slice(0,15)}.json`)};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.formato!=='termos-consentimento')throw new Error('arquivo inválido');
    const ub=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
    let n=0;for(const t of j.termos||[])await dbPut('termos',t);for(const r of j.registros||[]){if(!await dbGet('registros',r.id)){await dbPut('registros',{...r,pdf:ub(r.pdf)});n++}}
    toast(`Backup importado: ${n} registro(s) novo(s).`)}catch(err){toast('Falha na importação: '+err.message)}};
  $('#ver').onchange=async e=>{const f=e.target.files[0];if(!f)return;const h=await sha256(await f.arrayBuffer());const r=(await dbAll('registros')).find(x=>x.hashPDF===h);
    $('#res').innerHTML=r?`<div class="aviso ok"><b>Documento autêntico e íntegro.</b><br>${esc(r.termoTitulo)} — ${esc(r.dados.nome)} — assinado em ${esc(r.local)}<br><span class="mono">Registro ${esc(r.id)}</span></div>`:`<div class="aviso"><b>Não localizado.</b> O arquivo não corresponde a nenhum registro desta base, ou foi alterado após a geração.<br><span class="mono">SHA-256: ${h}</span></div>`};
}

(async()=>{
  try{await abrirDB();await semear();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});inicio();enviarPendentes().catch(()=>{})}
  catch(e){view(`<main class="wrap"><h1>Não foi possível iniciar</h1><p>O navegador bloqueou o armazenamento local (${esc(e&&e.message||e)}). Abra o arquivo em um navegador comum, fora do modo anônimo.</p></main>`)}
})();
</script>
